<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070F1A" />
    <title>ask Elon – offline</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <style>
      html, body { height: 100%; margin: 0; background: #070F1A; color: #F4F8FB;
        font-family: Inter, system-ui, -apple-system, "Segoe UI", Arial, sans-serif; }
      main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
        padding: 24px; box-sizing: border-box; text-align: center; gap: 12px; }
      img { width: 96px; height: 96px; border-radius: 22px; }
      h1 { font-size: 24px; margin: 8px 0 4px; }
      .elon { color: #FF6A00; }
      p { margin: 0; color: #BACADA; font-size: 16px; line-height: 1.45; max-width: 26em; }
      button { margin-top: 12px; background: #0B6E4F; color: #F4F8FB; border: 0; border-radius: 12px;
        padding: 12px 22px; font-size: 16px; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="ask Elon" />
      <h1>ask <span class="elon">Elon</span></h1>
      <p lang="en">You are offline. Check your connection and try again.</p>
      <p lang="pl">Brak połączenia z internetem. Sprawdź połączenie i spróbuj ponownie.</p>
      <p lang="ro">Nu există conexiune la internet. Verifică conexiunea și încearcă din nou.</p>
      <button type="button" onclick="location.reload()">Try again · Spróbuj ponownie · Încearcă din nou</button>
    </main>
  </body>
</html>
